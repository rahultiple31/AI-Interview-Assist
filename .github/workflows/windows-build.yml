name: Windows Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure final product directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path final-product -Force | Out-Null

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall .

      - name: Build executable
        shell: pwsh
        run: .\build_windows.ps1

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Interview-Assist-final-product-portable
          path: final-product/AI-Interview-Assist/**
          if-no-files-found: error

      - name: Compile installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup compiler was not found."
          }
          & $iscc ".\installer\AIInterviewAssist.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Interview-Assist-final-product-installer
          path: final-product/AI-Interview-Assist-Setup.exe
          if-no-files-found: error

      - name: Upload complete final product
        uses: actions/upload-artifact@v4
        with:
          name: AI-Interview-Assist-final-product
          path: final-product/**
          if-no-files-found: error
